# ---------------------------------------------------------------------------
# Generated by GitHub Profile Studio — review before committing.
#
# Workflow:  snake
# Purpose:   Regenerate the contribution snake from REAL GitHub contribution
#            data and commit it to this repository. The Studio preview is a
#            simulation with labelled sample data; the real asset exists only
#            after this workflow has run at least once.
# Asset:     assets/github-snake.svg — written to the branch that ran the workflow
#            (the default branch for scheduled and manual runs), so the README
#            can reference it with a repository-relative path.
# Schedule:  Weekly — cron '17 5 * * 1' (Mondays 05:17 UTC), plus manual runs
# Token:     the built-in GITHUB_TOKEN only — no personal access token and no
#            repository secrets. Nothing in this file reads or writes a secret.
#
# Actions are pinned to the full 40-character commit SHA of a tagged release,
# resolved from the authoritative repository (Git tag -> commit):
#   actions/checkout         v7.0.1  released 2026-07-20  3d3c42e5aac5ba805825da76410c181273ba90b1
#   Platane/snk/svg-only     v3.5.0  released 2026-04-25  d8f6715049803e982ee5ff501b6b9b7d5deeb09b
# Resolution sources:
#     https://api.github.com/repos/actions/checkout/git/ref/tags/v7.0.1
#     https://api.github.com/repos/Platane/snk/git/ref/tags/v3.5.0
# ---------------------------------------------------------------------------

name: snake

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read # least privilege: read-only by default

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    # Only this job may write, and only to commit the generated asset.
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # the push step authenticates with the job token

      - name: Generate the contribution snake (real contribution data)
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
          assets/github-snake.svg?color_snake=#0E4429&color_dots=#0D191A,#083622,#1D7232,#32B64A,#56D364

      - name: Commit the generated asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'assets/github-snake.svg'
          if git diff --cached --quiet; then
            echo "Snake asset unchanged — nothing to commit."
          else
            git commit -m "chore(snake): refresh the contribution snake"
            git push
          fi
